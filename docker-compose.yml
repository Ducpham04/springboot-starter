# Usage:
#   cp .env.example .env      # then edit secrets
#   docker compose up -d --build
#   open http://localhost:8080/swagger-ui.html
#
# Only the database (for running the app from the IDE with the dev profile):
#   docker compose up -d mysql

name: ${COMPOSE_PROJECT_NAME:-springboot-starter}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-starter}
      MYSQL_USER: ${DB_USERNAME:-starter}
      MYSQL_PASSWORD: ${DB_PASSWORD:-starter}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: ${APP_IMAGE:-springboot-starter:latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  mysql-data:
  uploads:
