# ===== English (default bundle) =====
# Keep keys in sync with messages_vi.properties

# --- Generic errors ---
error.internal=An unexpected error occurred. Please try again later.
error.validation=Invalid input data
error.bad-request=Malformed or invalid request
error.not-found=Resource not found: {0}
error.conflict=The data conflicts with an existing record or was modified by someone else
error.method-not-allowed=HTTP method not allowed
error.payload-too-large=File or request is too large
error.unauthorized=Authentication required
error.forbidden=You do not have permission to perform this action

# --- Auth ---
error.auth.invalid-credentials=Incorrect email or password
error.auth.account-disabled=Your account has been disabled
error.auth.token-invalid=Invalid access token
error.auth.token-expired=Access token has expired
error.auth.refresh-token-invalid=Invalid or expired refresh token
error.auth.reset-token-invalid=Reset link is invalid or has expired
error.auth.email-exists=Email {0} is already registered
error.auth.old-password-incorrect=Current password is incorrect
auth.logout.success=Logged out successfully
auth.password.changed=Password changed successfully. Please sign in again.
auth.password.reset=Password has been reset. Please sign in.
auth.forgot-password.sent=If the email exists, a reset link has been sent.
mail.reset-password.subject=Reset your password
mail.reset-password.body=Hello {0},\n\nClick the link below to reset your password:\n{1}\n\nThe link expires in {2} minutes. If you did not request this, please ignore this email.

# --- File ---
error.file.empty=File is empty
error.file.type-not-allowed=File type {0} is not allowed
error.file.not-found=File not found
error.file.storage=Could not store the file

# --- Product ---
error.product.not-found=Product with id {0} not found
error.product.sku-exists=SKU {0} already exists

# --- Custom validation messages ---
validation.password.weak=Password must contain at least one letter and one digit
validation.phone.invalid=Invalid phone number
validation.product.sku.pattern=SKU may only contain letters, digits, '-' and '_'

# --- Standard Bean Validation messages (override) ---
jakarta.validation.constraints.NotNull.message=must not be null
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotEmpty.message=must not be empty
jakarta.validation.constraints.Size.message=size must be between {min} and {max}
jakarta.validation.constraints.Email.message=must be a well-formed email address
jakarta.validation.constraints.Min.message=must be greater than or equal to {value}
jakarta.validation.constraints.Max.message=must be less than or equal to {value}
jakarta.validation.constraints.DecimalMin.message=must be greater than or equal to {value}
jakarta.validation.constraints.DecimalMax.message=must be less than or equal to {value}
jakarta.validation.constraints.Digits.message=numeric value out of bounds (<{integer} digits>.<{fraction} digits> expected)
jakarta.validation.constraints.Pattern.message=invalid format
jakarta.validation.constraints.Positive.message=must be greater than 0
jakarta.validation.constraints.PositiveOrZero.message=must be greater than or equal to 0
jakarta.validation.constraints.Past.message=must be a date in the past
jakarta.validation.constraints.Future.message=must be a date in the future
