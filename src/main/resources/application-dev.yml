# Local development. Run: docker compose up -d mysql && ./mvnw spring-boot:run
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # DEV ONLY - override with JWT_SECRET in any shared environment
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1wbGVhc2UtMzItYnl0ZXMtbWluIQ==}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@example.com}
    password: ${APP_ADMIN_PASSWORD:Admin@123}

logging:
  level:
    com.example.starter: DEBUG
    org.hibernate.SQL: INFO
