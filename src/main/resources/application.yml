# Shared configuration. Profile-specific overrides: application-dev.yml / application-prod.yml.
# Every value that differs between environments is read from an environment variable (see .env.example).
spring:
  application:
    name: ${APP_NAME:springboot-starter}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:starter}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:starter}
    password: ${DB_PASSWORD:starter}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${STORAGE_MAX_FILE_SIZE:10MB}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  threads:
    virtual:
      enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

app:
  default-locale: ${APP_DEFAULT_LOCALE:vi}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:springboot-starter}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  auth:
    password-reset-ttl: ${PASSWORD_RESET_TTL:30m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    max-file-size: ${STORAGE_MAX_FILE_SIZE:10MB}
    allowed-content-types: ${STORAGE_ALLOWED_TYPES:image/png,image/jpeg,image/webp,image/gif,application/pdf,text/plain,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:no-reply@example.com}
    reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    full-name: ${APP_ADMIN_FULL_NAME:Administrator}
